        function searchGuest() {
            const query = document.getElementById("searchInput").value.trim();
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "";

            if (query === "") return;

            const matches = guests.filter(g => g.name.includes(query));

            if (matches.length === 0) {
                resultDiv.innerHTML = "<p>查無資料，請確認字是否有誤，或洽現場工作人員。</p>";
            } else {
                matches.forEach(g => {
                    resultDiv.innerHTML += `
                        <div class="card">
                            <h3>${g.name} </h3>
                            <p class="table-num">桌號：${g.table}</p>
                            <p style="color: #888;">${g.note || ''}</p>
                        </div>`;
                });
            }
        }
