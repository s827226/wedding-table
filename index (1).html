            outline: none;

        }

        /* 查詢結果卡片 */
        .card {

            padding: 25px 20px;
            margin: 20px auto;
            max-width: 300px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border: 1px solid #f2e9de;

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: #333;
        }

        /* 桌號字體樣式（深色） */
        .table-num {
            font-size: 28px;
            color: #333333;
            font-weight: bold;
            margin: 10px 0;
        }

        function searchGuest() {
            const query = document.getElementById("searchInput").value.trim();
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "";

            if (query === "") return;

            const matches = guests.filter(g => g.name.includes(query));

            if (matches.length === 0) {
                resultDiv.innerHTML = "<p>查無資料，請確認字是否有誤，或洽現場工作人員。</p>";
            } else {
                matches.forEach(g => {
                    resultDiv.innerHTML += `
                        <div class="card">
                            <h3>${g.name}</h3>
                            <p class="table-num">桌號：${g.table}</p>
                            <p style="color: #888;">${g.note || ''}</p>
                        </div>`;
                });
            }
        }
